# The whole local Sokoul backend: MySQL, Redis, Mainapi (25565), proxiesembed (25569), the watch party (25566) and the
# optional web site (8088, --profile web, built from the third-party web reference kept outside the repository, see docs/building.md).
# Settings and secrets come from %LOCALAPPDATA%\SokoulApi\local.env (never committed, never baked into an image).
#   powershell -ExecutionPolicy Bypass -File API\start-backend.ps1      (does everything below, in order)
#   docker compose --env-file "$env:LOCALAPPDATA\SokoulApi\local.env" -f API\docker-compose.yml up -d --build
name: sokoul-api

x-local-env: &local-env
  env_file:
    - path: ${SOKOUL_ENV_FILE:-local.env}
      required: false

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=200"]
    ports: ["127.0.0.1:${DB_PORT}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", ""]
    ports: ["127.0.0.1:${REDIS_PORT}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mainapi:
    <<: *local-env
    build: ${SOKOUL_MAINAPI_CONTEXT:-./Mainapi}
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      # Inside the network the services reach each other by name; the app on the PC uses the published ports.
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PROXIESEMBED_INTERNAL_URL: http://proxiesembed:25569
    ports: ["0.0.0.0:25565:25565"]
    # Some ISP resolvers answer catalogue sites (coflix, frenchstream, anime-sama) with a block page address, and
    # CycleTLS resolves names itself. Service names (mysql, redis) still resolve through Docker's embedded DNS.
    dns: ["1.1.1.1", "9.9.9.9"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:25565/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8

  proxiesembed:
    <<: *local-env
    build: ${SOKOUL_PROXY_CONTEXT:-./proxiesembed}
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
    ports: ["0.0.0.0:25569:25569"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:25569/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8

  watchparty:
    build: ${SOKOUL_WATCHPARTY_CONTEXT:-./watchpartyAPI}
    restart: unless-stopped
    environment:
      WATCHPARTY_PORT: "25566"
    ports: ["0.0.0.0:25566:25566"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:25566/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

  web:
    profiles: [web]
    # The third-party web front end (see docs/third-party/README.md), served by its own Hono server (server/index.js). Only public values go into the bundle:
    # the addresses of the local services and the TMDB key the site uses in the browser.
    build:
      context: "${SOKOUL_WEB_CONTEXT:-../../Sokoul-reference/Sokoul a adapter}"
      args:
        VITE_SITE_URL: ${SITE_PUBLIC_URL}
        VITE_MAIN_API: ${PUBLIC_API_BASE}
        VITE_WATCHPARTY_API: ${WATCHPARTY_PUBLIC_URL}
        VITE_PROXIES_EMBED_API: ${PROXIESEMBED_PUBLIC_URL}
        VITE_TMDB_API_KEY: ${TMDB_API_KEY}
        VITE_ANALYTICS_PROVIDER: none
        # No mirror list, ads or error reporting from the upstream project's infrastructure.
        VITE_DEFAULT_MIRRORS: ""
        VITE_MIRRORS_CONFIG_URL: ""
    restart: unless-stopped
    depends_on: [mainapi]
    environment:
      PORT: "3001"
    ports: ["0.0.0.0:8088:3001"]

volumes:
  mysql-data:
